<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Analytics Dashboard</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>Game Analytics</h1><p>Track player engagement and revenue from your own daily entries.</p></div><button id="export">Export CSV</button></header><div class="grid" id="stats"></div><section class="panel"><h2>Add daily metrics</h2><form class="controls" id="entry"><label>Date<input type="date" name="date" required></label><label>Players<input type="number" name="players" min="0" required></label><label>Sessions<input type="number" name="sessions" min="0" required></label><label>Revenue (USD)<input type="number" name="revenue" min="0" step="0.01" required></label><button>Add day</button></form></section><section class="panel"><h2>Players by day</h2><div id="bars"></div></section><section class="panel"><h2>Daily records</h2><table><thead><tr><th>Date</th><th>Players</th><th>Sessions</th><th>Revenue</th><th></th></tr></thead><tbody id="rows"></tbody></table></section><footer>Open-source demo • Runs locally in your browser</footer><script src="app.js"></script></main></body></html>
